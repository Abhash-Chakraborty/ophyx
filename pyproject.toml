[project]
name = "ophyx"
version = "2.0.0"
description = "A 350M Python code model trained from scratch on Kaggle's free TPU, GPU and CPU quota"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Abhash Chakraborty" }]

# Most scripts run inside Kaggle sessions, where kaggle/launch.py installs what each one needs.
# These groups cover running them, or their tests, on your own machine.
[project.optional-dependencies]
run = ["torch", "transformers>=4.51", "huggingface_hub"]
ops = ["kaggle==2.2.4", "huggingface_hub>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "numpy", "safetensors"]

[project.urls]
Model = "https://huggingface.co/abhash-chakraborty/ophyx-350m-v2"
GGUF = "https://huggingface.co/abhash-chakraborty/ophyx-350m-v2-gguf"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# kaggle/launch.py prepends a CONFIG dict and any --include files before these run, so some names
# are defined only in the assembled script. launch.py lints that assembled file before every push.
"data/jobs/{bank_judge,bank_sample,bug_inject,problem_bank,verify_bank}.py" = ["F821"]
"data/synth/{t4_generate,t4_teacher}.py" = ["F821", "E402"]
"train/{grpo_t4,run_sequence,validate_tpu}.py" = ["F821"]
"eval/frontier_task.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
